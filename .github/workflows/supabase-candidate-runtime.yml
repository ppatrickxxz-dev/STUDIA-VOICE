name: PabloVoice candidate Supabase runtime

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the exact checked-out release SHA to the production Supabase runtime
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: yokmhqoncdwvxmzzybqa

jobs:
  deploy-candidate-runtime:
    if: ${{ github.ref == 'refs/heads/release/2026-09-17-pablovoice' && inputs.deploy == true }}
    runs-on: ubuntu-24.04
    environment: pablovoice-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pin runtime provenance to this Git SHA
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase secrets set "PABLOVOICE_RELEASE_SHA=$RELEASE_SHA" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy only the PabloVoice runtime functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy compute-kaggle-v58 --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy kaggle-worker-source-v58 --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy progress-kaggle-pipeline-job-v58 --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy complete-kaggle-pipeline-job-v58 --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy device-auth --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Verify exact runtime SHA and physical canary readiness
        env:
          PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "apikey: $PUBLISHABLE_KEY" \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/compute-kaggle-v58")"
          printf '%s\n' "$response" | jq -e --arg sha "$RELEASE_SHA" '.ok == true and .release_sha == $sha and .provider == "kaggle" and .engine == "ACE-Step 1.5" and .model == "acestep-v15-turbo" and .configured == true and .runnable == true and .physical_canary.verified == true' >/dev/null
          printf '%s\n' "$response" | jq '{release_sha,service,provider,engine,model,model_revision,configured,runnable,physical_canary}' >> "$GITHUB_STEP_SUMMARY"
