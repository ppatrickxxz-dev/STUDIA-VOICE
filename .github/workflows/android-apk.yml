name: PabloVoice Android APK Gate

on:
  workflow_dispatch:
  push:
    branches:
      - android/package-gate-20260825-1247
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Materialize PabloVoice Android source
        run: mkdir -p buildsrc && unzip -q android/PabloVoice-Android-base.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/PabloVoice-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s buildsrc/PabloVoice-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload PabloVoice APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PabloVoice-debug-apk
          path: buildsrc/PabloVoice-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct APK on isolated branch
        run: |
          mkdir -p dist
          cp buildsrc/PabloVoice-Android/app/build/outputs/apk/debug/app-debug.apk dist/PabloVoice.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PabloVoice.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish direct PabloVoice APK"
          git push origin HEAD:${GITHUB_REF_NAME}
