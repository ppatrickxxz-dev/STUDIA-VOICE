name: B08 Physical Evidence

on:
  push:
    branches: ['bench/b08-physical-evidence']
    paths:
      - '.github/workflows/b08-physical-evidence.yml'
      - 'tests/e2e/b08-physical-evidence.spec.mjs'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pablovoice-b08-physical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lock frozen B08 contract
        run: |
          mkdir -p test-results/b08-physical
          python3 benchmarks/validate_b08.py | tee test-results/b08-physical/contract-validator.txt

      - name: Build canonical Web runtime
        run: node scripts/build-web.mjs

      - name: Install Chromium physical runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Acquire exact private frozen references through trusted OIDC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/dist/__b08 test-results/b08-physical
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pablovoice-b08-physical"
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$TOKEN_URL" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          BROKER_RESPONSE="$(curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'content-type: application/json' \
            https://yokmhqoncdwvxmzzybqa.supabase.co/functions/v1/diagnose-once-v56)"
          test "$(printf '%s' "$BROKER_RESPONSE" | jq -r '.ok')" = "true"
          printf '%s' "$BROKER_RESPONSE" | jq '{ok,run_id,expires_in,assets:(.assets|with_entries(.value |= del(.url)))}' > test-results/b08-physical/broker-manifest.json

          curl --fail --silent --show-error --location "$(printf '%s' "$BROKER_RESPONSE" | jq -r '.assets.lead.url')" -o apps/web/dist/__b08/lead.flac
          curl --fail --silent --show-error --location "$(printf '%s' "$BROKER_RESPONSE" | jq -r '.assets.instrumental.url')" -o apps/web/dist/__b08/instrumental.flac
          curl --fail --silent --show-error --location "$(printf '%s' "$BROKER_RESPONSE" | jq -r '.assets.master.url')" -o apps/web/dist/__b08/master.flac

          echo '3fa6f448e32aa6b37e6800bdf5cd881cf12f139badb8069e28056a9b2d034f37  apps/web/dist/__b08/lead.flac' | sha256sum -c -
          echo '4908fa56f7475fd01ca1359701933ce4550de68c04418fba9c1a0fb117d0ff6a  apps/web/dist/__b08/instrumental.flac' | sha256sum -c -
          echo '4f480dd3f8417b38a78d1c7cb7d3fe02aef1c1aaa2d1bc439f3dd350c6c68fd9  apps/web/dist/__b08/master.flac' | sha256sum -c -
          test "$(stat -c%s apps/web/dist/__b08/lead.flac)" = '7046779'
          test "$(stat -c%s apps/web/dist/__b08/instrumental.flac)" = '15898389'
          test "$(stat -c%s apps/web/dist/__b08/master.flac)" = '36552984'
          cp benchmarks/assets/arrangement-change.json apps/web/dist/__b08/arrangement-change.json

      - name: Record runtime drift without changing frozen policy
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "execution_sha=${GITHUB_SHA}"
            echo "audio_engine_actual_blob=$(git hash-object packages/app/audio-engine.mjs)"
            echo "region_gain_actual_blob=$(git hash-object packages/audio/src/automation/region-gain.mjs)"
            echo "region_time_actual_blob=$(git hash-object packages/audio/src/automation/region-time.mjs)"
            echo "audio_engine_frozen_blob=7d6ee67ab51082ec33cc479784585372575f44ef"
            echo "region_gain_frozen_blob=5ad2688ea1acec70fa5ed7190d3f0449b6da2561"
            echo "region_time_frozen_blob=207ce06b8330cd962d73457baf6144c5db80747b"
          } | tee test-results/b08-physical/runtime-blobs.txt
          git cat-file blob 7d6ee67ab51082ec33cc479784585372575f44ef > /tmp/b08-frozen-audio-engine.mjs
          diff -u /tmp/b08-frozen-audio-engine.mjs packages/app/audio-engine.mjs > test-results/b08-physical/audio-engine-drift.diff || true
          git cat-file blob 5ad2688ea1acec70fa5ed7190d3f0449b6da2561 > /tmp/b08-frozen-region-gain.mjs
          diff -u /tmp/b08-frozen-region-gain.mjs packages/audio/src/automation/region-gain.mjs > test-results/b08-physical/region-gain-drift.diff || true
          git cat-file blob 207ce06b8330cd962d73457baf6144c5db80747b > /tmp/b08-frozen-region-time.mjs
          diff -u /tmp/b08-frozen-region-time.mjs packages/audio/src/automation/region-time.mjs > test-results/b08-physical/region-time-drift.diff || true

      - name: Start canonical built runtime
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/b08-web.log 2>&1 &
          import http.server, os, socketserver
          os.chdir('apps/web/dist')
          class Handler(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Cache-Control', 'no-store, max-age=0')
                  super().end_headers()
          with socketserver.TCPServer(('127.0.0.1', 4173), Handler) as server:
              server.serve_forever()
          PY
          echo $! > /tmp/b08-web.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b08-web.log
          exit 1

      - name: Execute real PabloAudioEngine B08 render in Chromium
        env:
          CI: 'true'
        run: npx playwright test tests/e2e/b08-physical-evidence.spec.mjs --reporter=line --workers=1

      - name: Seal retained output hashes and evidence identity
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('test-results/b08-physical')
          measurement = json.loads((root / 'measurement.json').read_text())
          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for block in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          outputs = {}
          for name in ('b08-instrumental-processed.wav', 'b08-mix-processed.wav'):
              path = root / name
              outputs[name] = {'sha256': digest(path), 'size_bytes': path.stat().st_size}
          measurement['execution_sha'] = os.environ['GITHUB_SHA']
          measurement['source_objects'] = {
              'lead': {'asset_id':'4fc561df-9ac8-4b69-9e59-381d8f15a907','sha256':'3fa6f448e32aa6b37e6800bdf5cd881cf12f139badb8069e28056a9b2d034f37','size_bytes':7046779},
              'instrumental': {'asset_id':'b43b4919-6860-49a3-95fc-bb94f2c7561b','sha256':'4908fa56f7475fd01ca1359701933ce4550de68c04418fba9c1a0fb117d0ff6a','size_bytes':15898389},
              'master': {'asset_id':'b8212b7b-8a93-4dd0-b6c9-9f008c403f3c','sha256':'4f480dd3f8417b38a78d1c7cb7d3fe02aef1c1aaa2d1bc439f3dd350c6c68fd9','size_bytes':36552984},
          }
          measurement['runtime_blobs'] = {
              'actual': {
                  'audio_engine': subprocess.check_output(['git','hash-object','packages/app/audio-engine.mjs'], text=True).strip(),
                  'region_gain': subprocess.check_output(['git','hash-object','packages/audio/src/automation/region-gain.mjs'], text=True).strip(),
                  'region_time': subprocess.check_output(['git','hash-object','packages/audio/src/automation/region-time.mjs'], text=True).strip(),
              },
              'frozen_plan': {
                  'audio_engine':'7d6ee67ab51082ec33cc479784585372575f44ef',
                  'region_gain':'5ad2688ea1acec70fa5ed7190d3f0449b6da2561',
                  'region_time':'207ce06b8330cd962d73457baf6144c5db80747b',
              },
          }
          measurement['retained_outputs'] = outputs
          measurement['contract_validator'] = 'passed'
          (root / 'measurement.json').write_text(json.dumps(measurement, indent=2) + '\n')
          print(json.dumps({'execution_sha': measurement['execution_sha'], 'outputs': outputs, 'acoustic_guards': measurement['acoustic_guards'], 'project_preservation': measurement['project_preservation']}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b08-physical-evidence-${{ github.sha }}
          path: |
            test-results/b08-physical
            /tmp/b08-web.log
          if-no-files-found: error
          retention-days: 30
