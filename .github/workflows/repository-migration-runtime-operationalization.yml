name: Repository migration - runtime operationalization

on:
  push:
    branches: [fix/runtime-operationalization-v1]
    paths:
      - '.runtime-operationalization-trigger'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-operationalization-v1
          fetch-depth: 0

      - name: Replace recycled runtime aliases with canonical slugs
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/voice-model-candidate-train.yml')
          text = path.read_text()
          old = """  # Supabase project is at its Edge Function count cap. These two legacy UI\n  # slots are intentionally recycled for the candidate-training runtime.\n  TRAIN_DISPATCH_FUNCTION: app-v56\n  TRAIN_PROMOTER_FUNCTION: app-v61\n"""
          new = """  TRAIN_DISPATCH_FUNCTION: compute-kaggle-voice-train-v1\n  TRAIN_PROMOTER_FUNCTION: promote-voice-candidate-v1\n"""
          if old not in text:
              raise SystemExit('legacy alias block not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('legacy alias block is ambiguous')
          path.write_text(text.replace(old, new, 1))

      - name: Run runtime architecture contract
        run: node --test tests/contracts/runtime-operationalization.test.mjs

      - name: Remove migration-only files
        run: |
          rm -f .runtime-operationalization-trigger
          rm -f .github/workflows/repository-migration-runtime-operationalization.yml

      - name: Commit canonical runtime wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/voice-model-candidate-train.yml .runtime-operationalization-trigger .github/workflows/repository-migration-runtime-operationalization.yml
          git diff --cached --check
          git commit -m 'fix(runtime): use canonical voice training functions'
          git push origin HEAD:fix/runtime-operationalization-v1
