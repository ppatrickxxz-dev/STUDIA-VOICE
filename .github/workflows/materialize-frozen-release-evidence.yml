name: Materialize frozen release evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: materialize-frozen-release-evidence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire repository OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pablovoice-signing")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Materialize canonical source
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"action":"materialize","expected_sha256":"852890854c128a4ee222505a910c3dc01465579d34ed6b49b5019aec8f16ad83"}'
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'content-type: application/json' \
            --data "$body" \
            'https://yokmhqoncdwvxmzzybqa.supabase.co/functions/v1/diagnose-once-v56')"
          echo "$response" | python -m json.tool
          python -c 'import json,sys; result=json.load(sys.stdin); asset=result.get("asset") or {}; assert result.get("ok") is True, result; assert asset.get("sha256") == "852890854c128a4ee222505a910c3dc01465579d34ed6b49b5019aec8f16ad83", result; assert int(asset.get("size_bytes") or 0) == 13909412, result' <<<"$response"

      - name: Materialize frozen provider input
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"action":"materialize","expected_sha256":"85b6341bac253f85a48506400baed3dd2bbf212ac172af6d0fa8e47d35642b95"}'
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'content-type: application/json' \
            --data "$body" \
            'https://yokmhqoncdwvxmzzybqa.supabase.co/functions/v1/diagnose-once-v56')"
          echo "$response" | python -m json.tool
          python -c 'import json,sys; result=json.load(sys.stdin); asset=result.get("asset") or {}; assert result.get("ok") is True, result; assert asset.get("sha256") == "85b6341bac253f85a48506400baed3dd2bbf212ac172af6d0fa8e47d35642b95", result; assert int(asset.get("size_bytes") or 0) == 15335120, result' <<<"$response"
