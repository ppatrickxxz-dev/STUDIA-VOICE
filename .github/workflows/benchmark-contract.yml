name: Benchmark Contract

on:
  push:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmark-contract.yml'
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmark-contract.yml'

jobs:
  validate-benchmark-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate locked benchmark contract
        run: |
          python benchmarks/validate_benchmark.py
          python benchmarks/validate_b06.py
