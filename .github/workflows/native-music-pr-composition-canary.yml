name: PabloVoice real composition canary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/native-music-pr-composition-canary.yml'
      - '.github/scripts/real-composition-canary.mjs'
      - 'packages/app/native-music-generation-client.mjs'
      - 'packages/app/native-music-result-runtime.mjs'
      - 'packages/app/generated-vocal-audit.mjs'
      - 'packages/app/stems-result-runtime.mjs'
      - 'supabase/functions/compute-kaggle-v58/index.ts'
      - 'supabase/functions/kaggle-worker-source-v58/index.ts'
      - 'supabase/functions/progress-kaggle-pipeline-job-v58/index.ts'
      - 'supabase/functions/complete-kaggle-pipeline-job-v58/index.ts'

concurrency:
  group: pablovoice-real-composition-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PV_STUDIO_ORIGIN: https://studia-voice.ppatrickxxz.workers.dev

permissions:
  contents: read

jobs:
  real-composition:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/real-composition
          printf '{"verdict":"STARTED","github_sha":"%s","github_run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > test-results/real-composition/start.json

      - name: Ensure audio inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Compose a real song and verify acoustic vocal presence
        shell: bash
        run: node .github/scripts/real-composition-canary.mjs

      - name: Retain the exact composition sample and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pablovoice-real-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/real-composition
          if-no-files-found: error
          retention-days: 7
