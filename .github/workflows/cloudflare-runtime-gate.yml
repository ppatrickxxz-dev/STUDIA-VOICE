name: Cloudflare Runtime Gate

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'packages/app/**'
      - 'services/api/**'
      - 'tests/contracts/cloudflare-runtime.test.mjs'
      - '.github/workflows/cloudflare-runtime-gate.yml'
      - '.github/workflows/composer-provider-canary.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pull-requests: read
  checks: read
  id-token: write

concurrency:
  group: cloudflare-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: https://yokmhqoncdwvxmzzybqa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_bERmgxiwqEbVFUQ2W5-ggA_1Z6-vALH
  PROJECT_ID: d64e4de9-791e-41bc-9307-7957389b2499

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build canonical Web
        run: npm run build:web
      - name: Verify Cloudflare runtime contract
        run: node --test tests/contracts/cloudflare-runtime.test.mjs
      - name: Bundle Worker and Static Assets without deployment
        run: npx --yes wrangler@4.127.1 deploy --dry-run --outdir .cloudflare-dry-run

  physical-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: pablovoice-production
    timeout-minutes: 8
    steps:
      - name: Discover native Cloudflare public URL for this exact head
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          url=''
          for attempt in $(seq 1 48); do
            deployments="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/deployments?sha=$HEAD_SHA&per_page=100")"
            while IFS= read -r statuses_url; do
              [ -n "$statuses_url" ] || continue
              statuses="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$statuses_url?per_page=100")"
              candidate="$(printf '%s' "$statuses" | jq -r '[.[] | select(.state == "success") | .environment_url // empty] | map(select(test("^https://"))) | first // empty')"
              if [ -n "$candidate" ]; then url="$candidate"; break; fi
            done < <(printf '%s' "$deployments" | jq -r '.[].statuses_url // empty')
            if [ -z "$url" ]; then
              comments="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/issues/$PR_NUMBER/comments?per_page=100")"
              candidate="$(printf '%s' "$comments" | jq -r '.[].body // empty' | grep -Eo 'https://[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev' | tail -n 1 || true)"
              if [ -n "$candidate" ]; then url="$candidate"; fi
            fi
            if [ -n "$url" ]; then break; fi
            sleep 5
          done
          test -n "$url" || { echo 'CLOUDFLARE_PHYSICAL_GATE_FAILED: native Workers Builds published no public same-head URL.' >&2; exit 1; }
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          printf 'Cloudflare URL: %s\nHead SHA: %s\n' "$url" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke physical Studio, Site Vivo and Cloudflare APIs
        env:
          BASE_URL: ${{ steps.discover.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fetch_200() {
            local path="$1" out="$2" headers="$3"
            code="$(curl --fail-with-body --silent --show-error -D "$headers" -o "$out" -w '%{http_code}' "$BASE_URL$path" || true)"
            if [ "$code" != '200' ]; then
              echo "CLOUDFLARE_PHYSICAL_GATE_FAILED: $path returned HTTP $code" >&2
              cat "$out" >&2 2>/dev/null || true
              exit 1
            fi
          }
          fetch_200 '/' "$tmp/root.html" "$tmp/root.headers"
          fetch_200 '/site/' "$tmp/site.html" "$tmp/site.headers"
          grep -qi '^x-content-type-options: nosniff' "$tmp/root.headers"
          fetch_200 '/api/health' "$tmp/health.json" "$tmp/health.headers"
          jq -e '.ok == true' "$tmp/health.json" >/dev/null
          fetch_200 '/api/provider-readiness' "$tmp/readiness.json" "$tmp/readiness.headers"
          jq -e '.ok == true and .providers.pablovoice.transport == "cloudflare_workers_ai" and .providers.pablovoice.configured == true and .providers.pablovoice.runnable == true and .secrets_exposed == false' "$tmp/readiness.json" >/dev/null
          fetch_200 '/api/pablo-agent' "$tmp/agent.json" "$tmp/agent.headers"
          jq -e '.ok == true and .provider == "cloudflare_workers_ai" and .configured == true and .credential_exposed == false' "$tmp/agent.json" >/dev/null
          code="$(curl --silent --show-error -o "$tmp/unauth.json" -w '%{http_code}' -X POST "$BASE_URL/api/pablo-agent" -H 'content-type: application/json' --data '{"command":"generate","task":"release gate authentication probe","project_id":"00000000-0000-0000-0000-000000000000"}')"
          test "$code" = '401'
          jq -e '.ok == false and .error == "auth_required"' "$tmp/unauth.json" >/dev/null

      - name: Acquire OIDC-backed PabloVoice user session
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pablovoice-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          SESSION="$(curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/device-auth" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'content-type: application/json' \
            --data '{"action":"b09_session"}')"
          ACCESS_TOKEN="$(printf '%s' "$SESSION" | jq -er '.session.access_token')"
          test "$(printf '%s' "$SESSION" | jq -er '.project_id')" = "$PROJECT_ID"
          echo "::add-mask::$ACCESS_TOKEN"
          printf 'PV_ACCESS_TOKEN=%s\n' "$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Prove authenticated Workers AI generation on exact preview
        env:
          BASE_URL: ${{ steps.discover.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -nc --arg project "$PROJECT_ID" '{command:"rewrite",project_id:$project,task:"Reescreva em português brasileiro, mantendo a intenção e a oralidade: Hoje eu saí sem procurar. Retorne somente uma linha curta para revisão.",constraints:{canary:true,max_lines:1}}')"
          RESPONSE_FILE="$(mktemp)"
          CODE="$(curl --silent --show-error --max-time 30 -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "$BASE_URL/api/pablo-agent" \
            -H "Authorization: Bearer $PV_ACCESS_TOKEN" \
            -H 'content-type: application/json' \
            --data "$BODY")"
          test "$CODE" = '200'
          jq -e --arg project "$PROJECT_ID" '
            .ok == true and
            .provider == "cloudflare_workers_ai" and
            (.model | type == "string" and length > 0) and
            .command == "rewrite" and
            .project_id == $project and
            (.request_id | type == "string" and length > 0) and
            (.latency_ms | type == "number" and . >= 0) and
            (.reply | type == "string" and length > 0) and
            .fallback_allowed == false
          ' "$RESPONSE_FILE" >/dev/null
          printf 'CLOUDFLARE_AUTHENTICATED_AI_ROUNDTRIP_PASSED %s\n' "$BASE_URL"
