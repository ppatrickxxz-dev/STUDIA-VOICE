name: PabloVoice Web Functional Gate

on:
  push:
    branches: [main, develop, 'integration/**', 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pablovoice-web-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index-multipart-patch:
    if: github.ref == 'refs/heads/fix/voice-train-index-multipart'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic multipart patch
        run: python3 scripts/apply-index-multipart-patch.py
      - name: Verify focused voice contracts
        run: node --test tests/contracts/voice-model-candidate-training.test.mjs tests/contracts/voice-model-resumable-storage.test.mjs tests/contracts/voice-model-applio-config-init.test.mjs
      - name: Commit only canonical patch and restore gate
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/web-functional-gate.yml > .github/workflows/web-functional-gate.yml
          rm -f .github/workflows/index-multipart-patch-once.yml .github/trigger-index-multipart scripts/apply-index-multipart-patch.py
          git config user.name 'pablovoice-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No patch changes produced'; exit 1; } || true
          git commit -m 'fix(voice): store large RVC index as multipart artifacts'
          git push origin HEAD:fix/voice-train-index-multipart

  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build canonical Web
        run: node scripts/build-web.mjs
      - name: Install Chromium gate dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local canonical build
        run: |
          python3 - <<'PY' > /tmp/pablovoice-web.log 2>&1 &
          import http.server
          import os
          import socketserver

          os.chdir('apps/web/dist')

          class GateHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  for header in ('If-Modified-Since', 'If-None-Match'):
                      if header in self.headers:
                          del self.headers[header]
                  return super().do_GET()

              def end_headers(self):
                  self.send_header('Cache-Control', 'no-store, max-age=0')
                  super().end_headers()

          with socketserver.TCPServer(('127.0.0.1', 4173), GateHandler) as server:
              server.serve_forever()
          PY
          echo $! > /tmp/pablovoice-web.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pablovoice-web.log
          exit 1
      - name: Run browser functional gate
        env:
          CI: 'true'
        run: npx playwright test tests/e2e/web-functional-gate.spec.mjs tests/e2e/pablo-composer-reload-gate.spec.mjs tests/e2e/pablo-recording-flow-gate.spec.mjs tests/e2e/pablo-section-here-gate.spec.mjs tests/e2e/pablo-section-audition-gate.spec.mjs tests/e2e/pablo-section-vocal-gain-gate.spec.mjs tests/e2e/pablo-section-mix-undo-gate.spec.mjs tests/e2e/pablo-section-mix-ab-gate.spec.mjs tests/e2e/pablo-section-vocal-brightness-gate.spec.mjs tests/e2e/pablo-section-vocal-body-gate.spec.mjs tests/e2e/pablo-section-vocal-softness-gate.spec.mjs tests/e2e/pablo-section-vocal-presence-gate.spec.mjs tests/e2e/pablo-section-vocal-dynamics-gate.spec.mjs tests/e2e/pablo-section-vocal-deesser-gate.spec.mjs tests/e2e/pablo-section-vocal-plosive-gate.spec.mjs tests/e2e/pablo-section-vocal-cleanup-gate.spec.mjs tests/e2e/pablo-section-vocal-click-gate.spec.mjs tests/e2e/pablo-section-vocal-scan-gate.spec.mjs tests/e2e/pablo-full-vocal-scan-gate.spec.mjs tests/e2e/pablo-full-vocal-treatment-gate.spec.mjs tests/e2e/pablo-complete-user-flow-gate.spec.mjs tests/e2e/pablo-vocal-restoration-gate.spec.mjs tests/e2e/pablo-section-vocal-hum-gate.spec.mjs tests/e2e/pablo-vocal-restoration-recommendation-gate.spec.mjs tests/e2e/pablo-vocal-restoration-selective-gate.spec.mjs tests/e2e/site-vivo-functional-gate.spec.mjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pablovoice-web-functional-evidence-${{ github.sha }}
          path: |
            test-results
            playwright-report
            /tmp/pablovoice-web.log
          if-no-files-found: warn
          retention-days: 14
