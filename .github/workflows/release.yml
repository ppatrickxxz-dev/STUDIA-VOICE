name: PabloVoice signed release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.4.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pablovoice-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch protected signing material via GitHub OIDC
        env:
          SIGNING_BROKER_URL: https://yokmhqoncdwvxmzzybqa.supabase.co/functions/v1/device-auth
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pablovoice-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "$SIGNING_BROKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"action":"signing_bundle"}')"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and (.bundle.keystore_b64|length>0) and (.bundle.store_password|length>0) and (.bundle.key_alias|length>0) and (.bundle.key_password|length>0)' >/dev/null
          KEYSTORE_B64="$(printf '%s' "$RESPONSE" | jq -r '.bundle.keystore_b64')"
          STORE_PASSWORD="$(printf '%s' "$RESPONSE" | jq -r '.bundle.store_password')"
          KEY_ALIAS="$(printf '%s' "$RESPONSE" | jq -r '.bundle.key_alias')"
          KEY_PASSWORD="$(printf '%s' "$RESPONSE" | jq -r '.bundle.key_password')"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pablovoice-release.jks"
          chmod 600 "$RUNNER_TEMP/pablovoice-release.jks"
          {
            echo "PV_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PV_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "PV_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          unset OIDC_TOKEN OIDC_JSON RESPONSE KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
      - name: Re-run release gates
        run: |
          node scripts/lint.mjs
          node --test tests/unit/*.test.mjs tests/contracts/*.test.mjs
          bash scripts/security-gate.sh
          node scripts/build-web.mjs
          node scripts/verify-web-build.mjs
          node scripts/performance-gate.mjs
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed APK and AAB
        env:
          PV_RELEASE_STORE_FILE: ${{ runner.temp }}/pablovoice-release.jks
        run: gradle -p apps/android --no-daemon verifyReleaseSigning lintRelease assembleRelease bundleRelease
      - name: Validate signed release APK
        run: |
          bash scripts/validate-apk.sh apps/android/app/build/outputs/apk/release/app-release.apk com.pablovoice.studio
          sha256sum apps/android/app/build/outputs/bundle/release/app-release.aab > apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
      - name: Upload stable signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pablovoice-signed-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Create draft GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            apps/android/app/build/outputs/apk/release/app-release.apk \
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256 \
            apps/android/app/build/outputs/bundle/release/app-release.aab \
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256 \
            --draft --verify-tag --generate-notes --title "PabloVoice $RELEASE_TAG"
