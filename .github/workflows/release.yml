name: PabloVoice signed release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package version (for example v2.4.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: pablovoice-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pablovoice-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate release tag intent
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "RELEASE_TAG_MISMATCH: requested '$RELEASE_TAG', package requires '$EXPECTED_TAG'" >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*|v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "RELEASE_TAG_INVALID: '$RELEASE_TAG' is not a supported PabloVoice release tag" >&2
              exit 1
              ;;
          esac
      - name: Fetch protected signing material via GitHub OIDC
        env:
          SIGNING_BROKER_URL: https://yokmhqoncdwvxmzzybqa.supabase.co/functions/v1/device-auth
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pablovoice-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDIDC_JSON" | jq -er '.value')"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "$SIGNING_BROKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"action":"signing_bundle"}')"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and (.bundle.keystore_b64|length>0) and (.bundle.store_password|length>0) and (.bundle.key_alias|length>0) and (.bundle.key_password|length>0)' >/dev/null
          KEYSTORE_B64="$(printf '%s' "$RESPONSE" | jq -r '.bundle.keystore_b64')"
          STORE_PASSWORD="$(printf '%s' "$RESPONSE" | jq -r '.bundle.store_password')"
          KEY_ALIAS="$(printf '%s' "$RESPONSE" | jq -r '.bundle.key_alias')"
          KEY_PASSWORD="$(printf '%s' "$RESPONSE" | jq -r '.bundle.key_password')"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pablovoice-release.jks"
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/pablovoice-store.pass"
          printf '%s' "$KEY_ALIAS" > "$RUNNER_TEMP/pablovoice-key.alias"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/pablovoice-key.pass"
          chmod 600 "$RUNNER_TEMP/pablovoice-release.jks" "$RUNNER_TEMP/pablovoice-store.pass" "$RUNNER_TEMP/pablovoice-key.alias" "$RUNNER_TEMP/pablovoice-key.pass"
          keytool -list \
            -keystore "$RUNNER_TEMP/pablovoice-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          unset OIDC_TOKEN OIDC_JSON RESPONSE KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
      - name: Re-run release gates
        run: |
          node scripts/lint.mjs
          node --test tests/unit/*.test.mjs tests/contracts/*.test.mjs
          bash scripts/security-gate.sh
          node scripts/build-web.mjs
          node scripts/verify-web-build.mjs
          node scripts/performance-gate.mjs
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed APK and AAB
        run: |
          set -euo pipefail
          export PV_RELEASE_STORE_FILE="$RUNNER_TEMP/pablovoice-release.jks"
          export PV_RELEASE_STORE_PASSWORD="$(cat "$RUNNER_TEMP/pablovoice-store.pass")"
          export PV_RELEASE_KEY_ALIAS="$(cat "$RUNNER_TEMP/pablovoice-key.alias")"
          export PV_RELEASE_KEY_PASSWORD="$(cat "$RUNNER_TEMP/pablovoice-key.pass")"
          gradle -p apps/android --no-daemon verifyReleaseSigning lintRelease assembleRelease bundleRelease
      - name: Validate signed release APK and AAB
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          AAB=apps/android/app/build/outputs/bundle/release/app-release.aab
          bash scripts/validate-apk.sh "$APK" com.pablovoice.studio
          bash scripts/android-validate-signed-aab.sh "$APK" "$AAB"
      - name: Upload stable signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pablovoice-signed-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
            apps/android/app/build/outputs/bundle/release/app-release.aab.jarsigner.txt
            apps/android/app/build/outputs/bundle/release/app-release.aab.signer-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Create or verify release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "RELEASE_TAG_DRIFT: '$RELEASE_TAG' points to '$TAG_SHA', expected '$GITHUB_SHA'" >&2
              exit 1
            fi
            echo "Release tag already points to the approved SHA."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "PabloVoice $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Create or refresh draft GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_FILES=(
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
          )
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/pablovoice-release.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' /tmp/pablovoice-release.json)" != "true" ]; then
              echo "RELEASE_ALREADY_PUBLISHED: refusing to overwrite published release '$RELEASE_TAG'" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${RELEASE_FILES[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${RELEASE_FILES[@]}" \
              --draft --verify-tag --generate-notes --title "PabloVoice $RELEASE_TAG"
          fi

  signed-release-emulator:
    needs: signed-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: pablovoice-signed-${{ github.sha }}
          path: artifacts/android-signed
      - name: Resolve signed production APK
        run: find artifacts/android-signed -name app-release.apk -type f -print -quit | tee /tmp/pv-release-apk-path
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
            echo 'KVM acceleration enabled for signed Android release gate.'
          else
            echo 'KVM device unavailable; emulator runner will use its supported fallback.'
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-signed-release-emulator-gate.sh "$(cat /tmp/pv-release-apk-path)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pablovoice-android-signed-release-evidence-${{ github.sha }}
          path: test-results/android-signed-release-emulator
          if-no-files-found: error
          retention-days: 14
