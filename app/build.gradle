plugins {
    id 'com.android.application'
}

def pvUrl = providers.gradleProperty("pabloVoiceUrl")
        .orElse("https://pablovoice-unified-mobile-repair-8-chi.vercel.app/")
        .get()
def pvUrlEscaped = pvUrl.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace 'com.pablovoice.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.pablovoice.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "PABLOVOICE_URL", "\"${pvUrlEscaped}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}
